name: Qt 6 native OpenGL preview

on: [push, pull_request]

permissions:
  contents: read

jobs:
  native-preview:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.11.2
        with:
          pixi-version: v0.71.1
          cache: true
      - run: pixi install --locked
      - run: pixi run --locked build
      - name: Verify a rendered 3D surface in the actual Qt OpenGL framebuffer
        run: pixi run --locked --executable ./build/pixi/gui/runGuiTests nativeSurfacePreview

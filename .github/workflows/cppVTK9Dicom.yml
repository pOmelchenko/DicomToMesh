name: Pixi build and tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.11.2
        with:
          pixi-version: v0.71.1
          cache: true
      - name: Verify locked dependencies
        run: pixi install --locked
      - name: Build and run synthetic DICOM, segmentation, CLI and GUI tests
        run: pixi run --locked test
      - name: CLI smoke test
        run: pixi run --locked --skip-deps cli -h

[workspace]
name = "dicom-to-mesh"
description = "Build and run DicomToMesh with a managed C++ environment"
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64"]

[dependencies]
cmake = ">=3.24,<5"
ninja = ">=1.11,<2"
pkg-config = ">=0.29,<1"
cxx-compiler = ">=1.7,<2"
# Keep VTK and the embedded GUI on the same Qt major version.
# Use the complete package: VTK's CMake exports also reference vtk-io-ffmpeg.
vtk = ">=9.5,<10"
qt6-main = ">=6.8,<7"
gtest = "1.17.*"
dcmtk = ">=3.6.9,<4"
zlib = ">=1.3,<2"
# conda-forge's VTK package includes Python bindings and their runtime.
python = "3.12.*"

[tasks]
configure = { cmd = 'cmake -S . -B build/pixi -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$CONDA_PREFIX" -DPKG_CONFIG_EXECUTABLE="$CONDA_PREFIX/bin/pkg-config" -DBUILD_GUI=ON -DUSE_VTK_DICOM=OFF -DTESTDICOM2MESH=ON -DTESTDICOM2MESHLIB=ON', description = "Configure the CLI, GUI and existing tests" }
build = { cmd = "cmake --build build/pixi --parallel", depends-on = ["configure"], description = "Build the CLI, GUI and tests" }
cli = { cmd = "./build/pixi/dicom2mesh/dicom2mesh", depends-on = ["build"], description = "Run the CLI; append DicomToMesh arguments" }
gui = { cmd = "./build/pixi/gui/dicom2meshgui", depends-on = ["build"], description = "Launch the Qt GUI" }
test = { cmd = "cmake -E copy_directory ../../lib/test/data lib/test/data && ./lib/runLibTests && ./dicom2mesh/runD2MTests && ./gui/runGuiTests", cwd = "build/pixi", env = { QT_QPA_PLATFORM = "offscreen" }, depends-on = ["build"], description = "Run the library, CLI and GUI tests in the build directory" }
skull-setup = { cmd = "pixi install --manifest-path environments/skull/pixi.toml --locked", description = "Install optional CHARM for MRI bone estimates (Apple Silicon, macOS 14+)" }
skull-check = { cmd = "pixi run --manifest-path environments/skull/pixi.toml --locked check", description = "Check the optional local MRI skull backend" }
skull-test = { cmd = "pixi run --manifest-path environments/skull/pixi.toml --locked test", description = "Test the optional MRI skull bridge" }

[target.osx.tasks]
gui = { cmd = "./build/pixi/gui/dicom2meshgui.app/Contents/MacOS/dicom2meshgui", depends-on = ["build"], description = "Launch the macOS Qt application" }

# The neural backend is optional and isolated from VTK's Python dependencies.
[feature.brain.dependencies]
python = "3.12.*"
numpy = "1.26.*"
pytorch-cpu = ">=2.2,<3"
surfa = "0.6.3.*"

[feature.brain.tasks]
brain-setup = { cmd = "python scripts/brain_extract.py --download-model", description = "Download and verify SynthStrip no-CSF weights (29 MB)" }
brain-test = { cmd = "python -m unittest discover -s scripts/tests -v", description = "Check brain input geometry and model integrity without inference" }

[environments]
default = { features = [], solve-group = "default" }
brain = { features = ["brain"], no-default-feature = true }
